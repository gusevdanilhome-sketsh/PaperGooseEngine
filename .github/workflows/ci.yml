name: CI

on:
  push:
    branches: [Dev]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmake_generator: "MinGW Makefiles"
            cmake_build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          submodules: true

      # --- Windows ---------------------------------------------------------
      - name: Установка MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Конфигурация CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DCMAKE_C_COMPILER=gcc

      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config ${{ matrix.cmake_build_type }} -j $(nproc)

      - name: Загрузка артефактов (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: papergoose-windows-${{ matrix.cmake_build_type }}
          path: |
            build/papergoose.exe
            build/*.dll
          if-no-files-found: error