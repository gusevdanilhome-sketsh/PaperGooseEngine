name: CI

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_type: Debug
          - os: windows-latest
            build_type: Release
          - os: ubuntu-latest
            build_type: Debug
          - os: ubuntu-latest
            build_type: Release

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Установка зависимостей (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - name: Установка зависимостей (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libvulkan-dev

      - name: Конфигурация CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -B build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DUSE_VULKAN=ON
          else
            cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DUSE_VULKAN=ON
          fi

      - name: Сборка
        run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)

      - name: Запуск тестов
        if: matrix.build_type == 'Debug'
        working-directory: build
        run: ctest --output-on-failure

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: papergoose-${{ runner.os }}-${{ matrix.build_type }}
          path: |
            build/papergoose*
            build/*.exe